<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>吾水阁账号安全验证码</title></head>
<body style="margin:0;background:#eff8fa;color:#123846;font-family:Arial,'Microsoft YaHei',sans-serif">
  <div style="max-width:480px;margin:32px auto;padding:32px;background:white;border-radius:16px">
    <p style="color:#07889b;font-weight:bold">吾水阁 · 账号中心</p>
    <h1 style="font-size:24px">验证是您本人操作</h1>
    <p style="line-height:1.8">请回到账号设置的密码修改表单，输入以下安全验证码：</p>
    <p style="font-size:32px;letter-spacing:6px;font-weight:bold">{{ .Token }}</p>
    <p style="line-height:1.8;color:#576f77">请勿向任何人提供验证码。如果不是您发起的操作，请忽略邮件，并检查账号安全。</p>
  </div>
</body></html>
