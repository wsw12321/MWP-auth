<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>确认修改账号邮箱</title></head>
<body style="margin:0;background:#eff8fa;color:#123846;font-family:Arial,'Microsoft YaHei',sans-serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:32px 16px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:white;border-radius:16px"><tr><td style="padding:32px">
      <p style="margin:0 0 28px;color:#07889b;font-size:18px;font-weight:bold">吾水阁 · 账号中心</p>
      <h1 style="font-size:24px;line-height:1.4">确认修改账号邮箱</h1>
      <p style="font-size:16px;line-height:1.8">您正在修改吾水阁账号的登录邮箱。为保护账号，请分别打开旧邮箱和新邮箱收到的确认邮件；完成两封邮件的确认后修改才会生效。</p>
      <p style="margin:28px 0"><a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=email_change&amp;redirect_to={{ .RedirectTo | urlquery }}" style="display:inline-block;padding:13px 22px;border-radius:9px;background:#087e92;color:white;text-decoration:none;font-weight:bold">确认邮箱修改</a></p>
      <p style="font-size:14px;line-height:1.8;color:#576f77">链接仅供本人使用，请勿转发。链接失效时，请回到账号中心重新发送邮件。</p>
      <p style="font-size:14px;line-height:1.8;color:#576f77">如果这不是您的操作，请忽略这封邮件；如果您怀疑账号遭到他人使用，请访问账号中心检查并重设密码。</p>
    </td></tr></table>
  </td></tr></table>
</body></html>
